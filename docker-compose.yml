services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-infrauser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infrapass}
      POSTGRES_DB: ${POSTGRES_DB:-infra_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infrauser} -d ${POSTGRES_DB:-infra_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - infradash

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: 3001
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN}
    volumes:
      - backend_data:/app/data
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    networks:
      - infradash

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - infradash

volumes:
  postgres_data:
  backend_data:

networks:
  infradash:
